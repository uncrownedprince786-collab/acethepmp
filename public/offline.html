<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Ace the PMP</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      background:#F8FAFC;
      color:#0F172A;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      padding:1.5rem;
      text-align:center;
    }
    .card{
      max-width:420px;
      width:100%;
      background:#fff;
      border-radius:1rem;
      padding:2.5rem 2rem;
      box-shadow:0 1px 3px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.04);
    }
    .icon{
      width:64px;height:64px;
      margin:0 auto 1.5rem;
      border-radius:50%;
      background:#0F766E;
      display:flex;align-items:center;justify-content:center;
    }
    .icon svg{width:32px;height:32px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    h1{font-size:1.5rem;font-weight:700;color:#0F172A;margin-bottom:.5rem}
    p{font-size:1rem;color:#475569;line-height:1.6;margin-bottom:1.5rem}
    .btn{
      display:inline-block;
      background:#F59E0B;
      color:#0F172A;
      font-weight:600;
      font-size:.9375rem;
      padding:.75rem 1.75rem;
      border:none;
      border-radius:.5rem;
      cursor:pointer;
      text-decoration:none;
      transition:background .15s;
    }
    .btn:hover{background:#D97706}
    .footer{margin-top:1.5rem;font-size:.8125rem;color:#94A3B8}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24">
        <line x1="1" y1="1" x2="23" y2="23"/>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <line x1="12" y1="20" x2="12.01" y2="20"/>
      </svg>
    </div>
    <h1>You're Offline</h1>
    <p>It looks like you've lost your internet connection. Ace the PMP needs an active connection to load questions and track your progress.</p>
    <button class="btn" onclick="window.location.reload()">Try Again</button>
    <div class="footer">acethepmp.com &mdash; Free PMP Exam Prep</div>
  </div>
</body>
</html>
