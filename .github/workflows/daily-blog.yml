name: daily-blog

on:
  schedule:
    - cron: "20 5 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "scripts/daily-blog/**"
      - ".github/workflows/daily-blog.yml"

concurrency:
  group: daily-blog
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scripts/daily-blog/package-lock.json

      - name: Install generator deps
        working-directory: scripts/daily-blog
        run: npm ci

      - name: Locate system Chrome for Puppeteer
        run: echo "CHROME_BIN=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium || true)" >> "$GITHUB_ENV"

      - name: Generate today's post
        working-directory: scripts/daily-blog
        env:
          DAILY_BLOG_API_KEY: ${{ secrets.DAILY_BLOG_API_KEY }}
          DAILY_BLOG_MODEL: ${{ secrets.DAILY_BLOG_MODEL }}
          DAILY_BLOG_BASE_URL: ${{ secrets.DAILY_BLOG_BASE_URL }}
          CHROME_BIN: ${{ env.CHROME_BIN }}
        run: node generate.mjs

      - name: Typecheck gate (posts.ts must stay valid)
        run: |
          if git diff --quiet HEAD -- src/content/posts.ts; then
            echo "no post changes this run"
            exit 0
          fi
          npx --yes -p typescript@5.9.3 tsc --noEmit --skipLibCheck --strict --esModuleInterop --module esnext --moduleResolution bundler --resolveJsonModule --isolatedModules --target es2017 src/content/posts.ts

      - name: Commit and push the post
        run: |
          if git diff --quiet HEAD -- src/content/posts.ts; then
            echo "no post changes to commit"
            exit 0
          fi
          git config user.name "ace-the-pmp daily bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/content/posts.ts
          git commit -m "chore(blog): automatic daily study guide"
          git push origin HEAD:master

      - name: Deploy via hook (when VERCEL_DEPLOY_HOOK secret is set)
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "no VERCEL_DEPLOY_HOOK secret configured"
            exit 0
          fi
          if [ "$(git log -1 --pretty=%s)" = "chore(blog): automatic daily study guide" ]; then
            curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" || echo "deploy hook POST failed"
          else
            echo "no new post this run; skipping deploy hook"
          fi

      - name: Deploy via Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "no VERCEL_TOKEN secret configured"
            exit 0
          fi
          if [ "$(git log -1 --pretty=%s)" = "chore(blog): automatic daily study guide" ]; then
            npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
          else
            echo "no new post this run; skipping deploy"
          fi

      - name: Warn when no deploy trigger is configured
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ] && [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning title=deploy-trigger-missing::Add a VERCEL_DEPLOY_HOOK or VERCEL_TOKEN repository secret so the nightly post auto-deploys to Vercel."
          fi